# NCR layers (OSE-2215): tests, then a build of the practice data.
#
# No secrets, no BigQuery, no network beyond PyPI: the job reads the committed
# practice rows. The weekly run against BigQuery comes with OSE-2216.
name: NCR layers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncr:
    name: NCR tests and practice build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Practice rows are what the generator makes
        run: |
          python -m ncr practice --out /tmp/practice
          diff -q fixtures/practice-rows.csv /tmp/practice/practice-rows.csv
          diff -q fixtures/practice-labels.csv /tmp/practice/practice-labels.csv
      - name: Build the layers from the practice rows
        run: python -m ncr build --rows fixtures/practice-rows.csv --labels fixtures/practice-labels.csv --out out
      - name: Build the proposed corridor segments for each geography
        run: |
          for g in geographies/*/; do python -m ncr corridors --geography "$g" --out "out/corridors/$(basename "$g")"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ncr-practice-layers
          path: out
