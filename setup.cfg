# mutmut (docs/mutation-testing.md). test_mutation_floor.py tests the CI tool,
# not ncr/, and reads files mutmut does not copy into its working tree.
[mutmut]
source_paths=ncr/
pytest_add_cli_args_test_selection=tests/
pytest_add_cli_args=--ignore=tests/test_mutation_floor.py
# The corridor tests build the committed geographies and check the Chicago
# generator script, so mutmut's working tree needs both.
also_copy=
    geographies/
    tools/
