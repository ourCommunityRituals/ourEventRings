<title>NCR Layer Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one working map. Header and place switch, layer chips, the map, then a reading panel for whatever was tapped. */
:root{
  --bg:#f3f5f6; --tint0:#e4ecf4; --tint1:#efe7d8; --tint2:#e2efe4; --tint3:#efe1e6; --tint4:#e9e6f2; --tint5:#e8eee0; --surface:#ffffff; --ink:#18232b; --muted:#56646e; --rule:#d5dce1;
  --ground:#eef1ef; --town:#6f7d86; --hood:#9aa7af; --hex:#b9c4cb; --hex6:#7f8f99; --hex5:#4f5f69;
  --one:#2f6fb0; --border:#c8661a; --transit:#7056a6; --ring:#1f8a5b; --ring-fill:rgba(31,138,91,.16);
  --street:#cfd6db; --street-major:#b3bec6; --street-x:#e2b860; --busy1:#c9dcef; --busy2:#7fa9d6; --busy3:#2f6fb0; --node:#18232b; --chip-on:#18232b; --chip-on-ink:#ffffff;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171b; --tint0:#1b2733; --tint1:#2a2519; --tint2:#1a2a20; --tint3:#2b1e24; --tint4:#221f2e; --tint5:#232a1c; --surface:#192127; --ink:#e7edf0; --muted:#9fb0ba; --rule:#2c3840;
  --ground:#161e23; --town:#8d9ca6; --hood:#5f6e78; --hex:#34424b; --hex6:#5d6d77; --hex5:#8797a1;
  --one:#5d9be0; --border:#ea8a3c; --transit:#a58ee0; --ring:#4cc28a; --ring-fill:rgba(76,194,138,.18);
  --street:#26323a; --street-major:#34434d; --street-x:#7a6330; --busy1:#22384d; --busy2:#2f5a86; --busy3:#4f8fd6; --node:#e7edf0; --chip-on:#e7edf0; --chip-on-ink:#11171b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171b; --tint0:#1b2733; --tint1:#2a2519; --tint2:#1a2a20; --tint3:#2b1e24; --tint4:#221f2e; --tint5:#232a1c; --surface:#192127; --ink:#e7edf0; --muted:#9fb0ba; --rule:#2c3840;
  --ground:#161e23; --town:#8d9ca6; --hood:#5f6e78; --hex:#34424b; --hex6:#5d6d77; --hex5:#8797a1;
  --one:#5d9be0; --border:#ea8a3c; --transit:#a58ee0; --ring:#4cc28a; --ring-fill:rgba(76,194,138,.18);
  --street:#26323a; --street-major:#34434d; --street-x:#7a6330; --busy1:#22384d; --busy2:#2f5a86; --busy3:#4f8fd6; --node:#e7edf0; --chip-on:#e7edf0; --chip-on-ink:#11171b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
h1{font-family:var(--font-display);font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 .85rem var(--font-body);padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  font:500 .82rem var(--font-body);padding:7px 11px;border-radius:999px;min-height:38px;cursor:pointer}
.chip .sw{width:14px;height:10px;border-radius:3px;flex:none}
.chip[aria-pressed="false"]{color:var(--muted);opacity:.62}
.chip[aria-pressed="false"] .sw{filter:grayscale(1)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 .85rem var(--font-body);padding:8px 13px;border-radius:999px;min-height:44px;cursor:pointer}
.step .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:.72rem}
.step[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.step[aria-pressed="true"] .num{background:var(--chip-on-ink);color:var(--chip-on)}
.step.all{color:var(--muted);border-style:dashed}
.step.all[aria-pressed="true"]{color:var(--chip-on-ink);border-style:solid}
.step.next{border-color:var(--ring);color:var(--ring)}
@media (prefers-reduced-motion:no-preference){svg g{transition:opacity .2s}}
.chip.more{border-style:dashed;color:var(--muted)}
.chip .n{font-size:.7rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
button:focus-visible{outline:2px solid var(--one);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;background:var(--ground);border:1px solid var(--rule);border-radius:12px;overflow:hidden;height:min(72vh,760px);touch-action:none}
svg{display:block;width:100%;height:100%;cursor:grab;user-select:none}
svg.dragging{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 1.1rem var(--font-body);cursor:pointer}
.tag{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--muted);border:1px solid var(--rule);border-radius:8px;font-size:.72rem;padding:4px 8px;max-width:calc(100% - 20px)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel h2{font-family:var(--font-display);font-size:1.08rem;margin:0}
.panel .eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.panel p{margin:0;color:var(--ink)}
.panel .why{color:var(--muted);font-size:.88rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.88rem}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.84rem}
.bar .t{position:relative;height:18px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar .t i{position:absolute;inset:0 auto 0 0;background:var(--one);opacity:.8}
.bar .t span{position:absolute;left:6px;top:0;line-height:18px;white-space:nowrap}
.bar b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.pill.b{color:var(--border)} .pill.o{color:var(--one)} .pill.r{color:var(--ring)}
.legend{display:grid;gap:6px;font-size:.84rem;color:var(--muted)}
.legend div{display:flex;gap:8px;align-items:center}
.legend .sw{width:22px;height:10px;border-radius:3px;flex:none}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .s7{fill:none;stroke:var(--ring);stroke-width:2}
.chart .s6{fill:none;stroke:var(--ring);stroke-width:2;stroke-dasharray:5 3}
.chart .cf{fill:var(--ring-fill);stroke:none}
.note{font-size:.78rem;color:var(--muted);margin:0}
/* map strokes */
.streets path{fill:none;stroke:var(--street);stroke-width:.8;stroke-linecap:round}
.streets.far path:not(.arterial):not(.expressway){display:none}
.streets path.arterial{stroke:var(--street-major);stroke-width:1.8}
.streets path.expressway{stroke:var(--street-x);stroke-width:3}
.towns{opacity:.6}
.streets{opacity:.7}
.towns path{stroke:var(--town);stroke-width:.9;stroke-opacity:.45}
.towns .c0{fill:var(--tint0)}.towns .c1{fill:var(--tint1)}.towns .c2{fill:var(--tint2)}.towns .c3{fill:var(--tint3)}.towns .c4{fill:var(--tint4)}.towns .c5{fill:var(--tint5)}
.areas path{fill:none;stroke:var(--hood);stroke-width:.7;stroke-dasharray:2 3;opacity:.5}
.transit path{fill:none;stroke:var(--transit);stroke-width:1.6;stroke-dasharray:7 3;opacity:.8}
.hex7 path{fill:none;stroke:var(--hex);stroke-width:.7;opacity:.7}
.hex6 path{fill:none;stroke:var(--hex6);stroke-width:1.4}
.hex5 path{fill:none;stroke:var(--hex5);stroke-width:2.2}
.busy path{stroke:none;opacity:.75}
.strips path{stroke-width:.6;cursor:pointer}
.strips path.t1{opacity:.62} .strips path.t2{opacity:.38}
.strips path.on{opacity:.95;stroke:var(--ink);stroke-width:2}
.rings path{cursor:pointer}
.rings .medium{fill:none;stroke:var(--ring);stroke-width:1.6;stroke-dasharray:9 4}
.rings .on{stroke-width:3.4}
.rings .core{fill:var(--ring-fill);stroke:var(--ring);stroke-width:3}
.rings .medium{fill:var(--ring-fill)!important;fill-opacity:.5}
.rings .peri{fill:none;stroke:var(--ring);stroke-width:1.3;stroke-dasharray:3 3}
.nodes circle{stroke:var(--surface);stroke-width:1.4;cursor:pointer}
.nodes circle.on{stroke:var(--ink);stroke-width:2.4}
svg path,svg circle{vector-effect:non-scaling-stroke}
.labels text{fill:var(--muted);paint-order:stroke;stroke:var(--ground);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-family:var(--font-body)}
.labels text.town{font-weight:500;fill:var(--town);opacity:.75}
.labels text.hood{font-style:italic}
.labels text.seg{fill:var(--ink);font-weight:500}
@media (prefers-reduced-motion:no-preference){.strips path{transition:opacity .15s}}
</style>
<script type="application/json" id="ncr-data">__NCR_DATA__</script>
<div class="wrap">
  <header>
    <div>
      <h1>NCR Layer Map</h1>
      <p class="sub">Prototype. Base map, then hexagons, corridors and rings on top. Step through them or see them all. Tap a strip, a dot or a ring to read it.</p>
    </div>
    <div class="seg" role="group" aria-label="Place">
      <button id="place-chicago" aria-pressed="true" data-place="chicago">Chicago SW</button>
      <button id="place-sawyer" aria-pressed="false" data-place="sawyer">Sawyer, MI</button>
    </div>
  </header>
  <div class="steps" id="steps" role="group" aria-label="Build the map one layer at a time"></div>
  <div class="chips" id="chips" role="group" aria-label="Layers"></div>
  <div class="stage">
    <div class="mapbox" id="mapbox">
      <svg id="map" role="img" aria-label="Layered map of corridor segments, nodes and hexagon areas"></svg>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit" aria-label="Fit the map">⤢</button>
      </div>
      <div class="tag" id="tag"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<script>
const DATA = JSON.parse(document.getElementById('ncr-data').textContent);
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const panel = document.getElementById('panel');
const LAYERS = [
  {id:'strips', label:'Corridors', sw:'var(--border)', on:true},
  {id:'rings', label:'Rings', note:'practice', sw:'var(--ring)', on:true},
  {id:'nodes', label:'Nodes', sw:'var(--node)', on:true},
  {id:'towns', label:'Towns', sw:'var(--tint1)', on:true},
  {id:'streets', label:'Streets', sw:'var(--street-major)', on:true},
  {id:'hex7', label:'Small areas', note:'zoom in', sw:'var(--hex)', on:true, more:true},
  {id:'areas', label:'Community areas', sw:'var(--hood)', on:false, more:true},
  {id:'transit', label:'Metra and CTA', sw:'var(--transit)', on:false, more:true},
  {id:'busy', label:'Busy places', note:'practice', sw:'var(--busy2)', on:false, more:true},
  {id:'hex6', label:'Medium areas', note:'res 6', sw:'var(--hex6)', on:true, more:true},
  {id:'hex5', label:'Large areas', note:'res 5', sw:'var(--hex5)', on:false, more:true},
  {id:'labels', label:'Names', sw:'var(--muted)', on:true, more:true},
];
// Detail that appears only up close (zoom factor at which it shows).
const NEAR = {hex7:2.2, minorStreets:2, segLabels:3, areaLabels:2.5};
const BASE=['towns','streets'];
const STEPS = [
  {id:'base', n:1, label:'Base map', focus:['towns','streets'], fade:[], say:'The base: towns in light tints and the main streets, kept see-through.'},
  {id:'hex', n:2, label:'Hexagons', focus:['hex7','hex6','hex5'], fade:[], say:'The three sizes rings are read at: small (res 7, thin), medium (res 6) and large (res 5, heavy).'},
  {id:'corridors', n:3, label:'Corridors', focus:['strips','nodes'], fade:['hex6'], say:'Corridors and their nodes: where the map is measuring. Orange ones cross a town line.'},
  {id:'rings', n:4, label:'Rings', focus:['rings'], fade:['hex6','strips','nodes'], say:'Rings on top, where traffic runs both ways. Tap one for its saturation.'},
  {id:'all', label:'All layers', say:''},
];
const state = {step:'base', more:false, place:'chicago', on:Object.fromEntries(LAYERS.map(l=>[l.id,l.on])), sel:null, k:1, x:0, y:0};
try { const s = JSON.parse(localStorage.getItem('ncr-layers-v5')||'null'); if (s) Object.assign(state.on, s); } catch(e) {}
const NODE_COLOUR = {'crossroads':'var(--node)','border retail':'var(--border)','transit':'var(--transit)','founding':'var(--ring)','destination':'var(--ring)'};
const NODE_WORD = {'crossroads':'Crossroads','border retail':'Retail at a town line','transit':'Station or transit hub','founding':'Founding node','destination':'Destination'};

function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for (const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function steps(){
  const box=document.getElementById('steps'); box.innerHTML='';
  for (const st of STEPS){
    const b=document.createElement('button'); b.className='step'+(st.id==='all'?' all':''); b.id='step-'+st.id;
    b.setAttribute('aria-pressed', state.step===st.id);
    b.innerHTML=(st.n?`<span class="num">${st.n}</span>`:'')+esc(st.label);
    b.onclick=()=>{ state.step=st.id; steps(); apply(); };
    box.appendChild(b);
  }
  const i=STEPS.findIndex(x=>x.id===state.step);
  if (state.step!=='all' && i<STEPS.length-2){ const nx=document.createElement('button'); nx.className='step next'; nx.id='step-next';
    nx.textContent='Next →'; nx.onclick=()=>{ state.step=STEPS[i+1].id; steps(); apply(); }; box.appendChild(nx); }
  document.getElementById('chips').style.display = state.step==='all' ? '' : 'none';
}
function chips(){
  const box=document.getElementById('chips'); box.innerHTML='';
  const more=document.createElement('button'); more.className='chip more'; more.id='layer-more';
  more.setAttribute('aria-expanded', state.more?'true':'false');
  more.textContent=state.more?'Fewer layers':'More layers';
  more.onclick=()=>{ state.more=!state.more; chips(); };
  for (const l of LAYERS){
    if (l.more && !state.more) continue;
    const b=document.createElement('button'); b.className='chip'; b.id='layer-'+l.id;
    b.setAttribute('aria-pressed', state.on[l.id]);
    b.innerHTML=`<span class="sw" style="background:${l.sw}"></span>${esc(l.label)}${l.note?` <span class="n">${esc(l.note)}</span>`:''}`;
    b.onclick=()=>{ state.on[l.id]=!state.on[l.id]; b.setAttribute('aria-pressed',state.on[l.id]); apply();
      try{localStorage.setItem('ncr-layers-v5',JSON.stringify(state.on))}catch(e){} };
    box.appendChild(b);
  }
  box.appendChild(more);
}

let root, groups={}, labelEls=[];
function draw(){
  const D=DATA[state.place]; svg.innerHTML=''; groups={}; labelEls=[];
  const [bx,by,bw,bh]=D.box; svg.setAttribute('viewBox',`${bx} ${by} ${bw} ${bh}`); svg.dataset.box=D.box.join(' ');
  root=el('g',{},svg);
  const g=id=>(groups[id]=el('g',{class:id},root));
  g('towns'); g('streets'); g('busy'); g('hex7'); g('hex6'); g('hex5'); g('areas'); g('transit'); g('strips'); g('nodes'); g('rings'); g('labels');
  const busyCol={1:'var(--busy1)',2:'var(--busy2)',3:'var(--busy3)'};
  for (const h of D.busy) el('path',{d:h.d,fill:busyCol[h.level]},groups.busy);
  for (const r of [7,6,5]) for (const h of D.hex[r]) el('path',{d:h.d},groups['hex'+r]);
  for (const s of D.streets) if (s.d) el('path',{d:s.d,class:s.kind||'minor'},groups.streets);
  for (const t of D.towns) el('path',{d:t.d,class:'c'+(t.c||0),'fill-rule':'evenodd'},groups.towns);
  for (const a of D.areas) el('path',{d:a.d},groups.areas);
  for (const t of D.transit) if (t.d) el('path',{d:t.d},groups.transit);
  for (const r of D.rings){
    for (const p of r.periphery) el('path',{d:p,class:'peri'},groups.rings);
    const o=el('path',{d:r.d,class:r.res===7?'core':'medium',tabindex:0,role:'button','aria-label':`${r.size} ring: ${r.places.join(', ')}`},groups.rings);
    o.dataset.id=r.id; o.addEventListener('click',e=>{e.stopPropagation(); select('ring',r.id)});
    o.addEventListener('keydown',e=>{ if(e.key==='Enter'){select('ring',r.id)} });
  }
  for (const s of D.segments){
    const p=el('path',{d:s.d,class:'t'+s.tier,fill:s.straddles?'var(--border)':'var(--one)',stroke:s.straddles?'var(--border)':'var(--one)',tabindex:0,role:'button','aria-label':`${s.name}, ${s.from} to ${s.to}`},groups.strips);
    p.dataset.id=s.id; p.addEventListener('click',e=>{e.stopPropagation(); select('seg',s.id)});
    p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); select('seg',s.id)} });
  }
  for (const n of D.nodes){
    const c=el('circle',{cx:n.at[0],cy:n.at[1],r:5,fill:NODE_COLOUR[n.kind]||'var(--node)',tabindex:0,role:'button','aria-label':n.name},groups.nodes);
    c.dataset.id=n.id; c.addEventListener('click',e=>{e.stopPropagation(); select('node',n.id)});
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'){select('node',n.id)} });
  }
  const lab=(x,y,txt,cls,size)=>{ const t=el('text',{x,y,class:cls,'text-anchor':'middle','dominant-baseline':'middle'},groups.labels); t.textContent=txt; t.dataset.size=size; labelEls.push(t); };
  for (const t of D.towns) if (t.area>0.5) lab(t.at[0],t.at[1],t.name,'town',10.5);
  for (const a of D.areas) lab(a.at[0],a.at[1]+4,a.name,'hood',10);
  for (const s of D.segments) lab(s.mid[0],s.mid[1],s.id,'seg',8.5);
  state.sel=null; fit(); apply(); info();
}

function apply(){
  const k=state.k;
  const st=STEPS.find(x=>x.id===state.step);
  if (st && st.focus){
    for (const id in groups){
      if (id==='labels') continue;
      const f=st.focus.includes(id), d=st.fade.includes(id)||BASE.includes(id);
      groups[id].style.display = (f||d) ? '' : 'none';
      groups[id].style.opacity = f ? '' : (BASE.includes(id) ? '' : '.4');
      groups[id].style.pointerEvents = f ? '' : 'none';
    }
    if (groups.streets) groups.streets.classList.toggle('far', k<NEAR.minorStreets);
    groups.labels.style.display='';
    for (const t of labelEls){
      let show=false;
      if (t.classList.contains('town')) show = st.id==='base' || st.id==='hex';
      else if (t.classList.contains('seg')) show = st.id==='corridors' && k>=NEAR.segLabels;
      t.style.display = show ? '' : 'none';
    }
    const tag=document.getElementById('tag'); if (tag) tag.textContent = `Step ${st.n} of 4. ${st.say}`;
    return;
  }
  for (const id in groups){ groups[id].style.opacity=''; groups[id].style.pointerEvents=''; }
  for (const id in groups) groups[id].style.display = state.on[id]===false ? 'none' : '';
  if (groups.hex7 && state.on.hex7) groups.hex7.style.display = k>=NEAR.hex7 ? '' : 'none';
  if (groups.streets) groups.streets.classList.toggle('far', k<NEAR.minorStreets);
  for (const t of labelEls){
    let show=true;
    if (t.classList.contains('seg')) show = state.on.strips && k>=NEAR.segLabels;
    else if (t.classList.contains('hood')) show = state.on.areas && k>=NEAR.areaLabels;
    else if (t.classList.contains('town')) show = state.on.towns || k<NEAR.segLabels;
    t.style.display = show ? '' : 'none';
  }
  const tag=document.getElementById('tag');
  if (tag) tag.textContent = k<NEAR.hex7 ? 'Zoom in for the small areas, side streets and segment names. More layers are under More layers.' : 'Streets: City of Chicago major streets; suburban streets follow the address grid (about 150 m).';
}

function view(){
  root.setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.k})`);
  const u=unitsPerPx()/state.k; for (const t of labelEls){ t.setAttribute('font-size', (+t.dataset.size*u).toFixed(2)); t.style.strokeWidth=(3*u).toFixed(2); }
  for (const c of svg.querySelectorAll('.nodes circle')) c.setAttribute('r',((state.k<2?4:5.5)*unitsPerPx()/state.k).toFixed(2));
  if (groups.labels) apply();
}
function unitsPerPx(){ const r=svg.getBoundingClientRect(); const [, , bw,bh]=svg.dataset.box.split(' ').map(Number); const u=Math.max(bw/r.width, bh/r.height); return (isFinite(u)&&u>0)?u:1; }
function fit(){ state.k=1; state.x=0; state.y=0; view(); }
function toUnits(px,py){ const r=svg.getBoundingClientRect(); const pt=svg.createSVGPoint(); pt.x=px; pt.y=py; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(f,ux,uy){ const k=Math.min(12,Math.max(.8,state.k*f)); f=k/state.k; state.x=ux-(ux-state.x)*f; state.y=uy-(uy-state.y)*f; state.k=k; view(); }
function zoomCentre(f){ const [bx,by,bw,bh]=svg.dataset.box.split(' ').map(Number); zoomAt(f,bx+bw/2,by+bh/2); }
document.getElementById('zin').onclick=()=>zoomCentre(1.6);
document.getElementById('zout').onclick=()=>zoomCentre(1/1.6);
document.getElementById('zfit').onclick=fit;
svg.addEventListener('wheel',e=>{ e.preventDefault(); const u=toUnits(e.clientX,e.clientY); zoomAt(Math.exp(-e.deltaY*0.0015),u.x,u.y); },{passive:false});
const ptrs=new Map(); let last=null, moved=0;
svg.addEventListener('pointerdown',e=>{ ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; svg.classList.add('dragging'); });
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===1){ const a=toUnits(prev.x,prev.y), b=toUnits(e.clientX,e.clientY); state.x+=b.x-a.x; state.y+=b.y-a.y; moved+=Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y); if(moved>4) svg.setPointerCapture(e.pointerId); view(); }
  else if (ptrs.size===2){ const [p,q]=[...ptrs.values()]; const other=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y), d1=Math.hypot(p.x-q.x,p.y-q.y); const m=toUnits((p.x+q.x)/2,(p.y+q.y)/2);
    if(d0>0) zoomAt(d1/d0,m.x,m.y); moved=99; }
});
const up=e=>{ ptrs.delete(e.pointerId); if(!ptrs.size) svg.classList.remove('dragging'); };
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{ if(moved<5){ state.sel=null; mark(); info(); } }, true);
svg.addEventListener('click',e=>{ if(moved>=5){ e.stopPropagation(); } }, true);

function select(kind,id){ if(moved>=5) return; state.sel={kind,id}; mark(); info(); }
function mark(){
  for (const p of svg.querySelectorAll('.strips path')) p.classList.toggle('on', state.sel?.kind==='seg' && p.dataset.id===state.sel.id);
  for (const c of svg.querySelectorAll('.nodes circle')) c.classList.toggle('on', state.sel?.kind==='node' && c.dataset.id===state.sel.id);
  for (const c of svg.querySelectorAll('.rings path[data-id]')) c.classList.toggle('on', state.sel?.kind==='ring' && c.dataset.id===state.sel.id);
}
function bars(obj){ const rows=Object.entries(obj); if(!rows.length) return '<p class="note">None.</p>';
  return '<div class="bars">'+rows.map(([k,v])=>`<div class="bar"><div class="t"><i style="width:${Math.round(v*100)}%"></i><span>${esc(k)}</span></div><b>${Math.round(v*100)}%</b></div>`).join('')+'</div>'; }

function chart(rings){
  const W=300,H=130,L=30,R=8,T=8,B=22; const all=rings.flatMap(r=>r.series); if(!all.length) return '';
  const t=d=>new Date(d).getTime(); const t0=Math.min(...all.map(p=>t(p[0]))), t1=Math.max(...all.map(p=>t(p[0])));
  const X=d=>L+(t(d)-t0)/(t1-t0||1)*(W-L-R), Y=v=>T+(1-v)*(H-T-B);
  let g=''; for (const v of [0,.5,1]) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v.toFixed(1)}</text>`;
  const yr=[...new Set(all.map(p=>p[0].slice(0,4)))]; for (const y of yr){ const d=y+'-01-01'; if(t(d)>=t0&&t(d)<=t1) g+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${y}</text>`; }
  let lines=''; for (const r of rings){ const pts=r.series.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    lines+=`<polyline class="s${r.res}" points="${pts}"/>`; }
  const leg=rings.map(r=>`${r.size} ${r.res===7?'solid':'dashed'}`).join(' · ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saturation over time for each practice ring">${g}${lines}</svg><p class="note">${esc(leg)}</p>`;
}
function info(){
  const D=DATA[state.place];
  if (state.sel?.kind==='seg'){
    const s=D.segments.find(x=>x.id===state.sel.id);
    panel.innerHTML=`<p class="eyebrow">Corridor segment ${esc(s.id)} · ${s.tier===1?'primary strip':'secondary strip'}</p>
      <h2>${esc(s.name)}</h2><p>${esc(s.from)} to ${esc(s.to)}</p>
      <div>${s.straddles?'<span class="pill b">Straddles a town line</span>':'<span class="pill o">Inside one town</span>'}</div>
      <dl><dt>Length</dt><dd>${s.km.toFixed(2)} km</dd><dt>Rides a town line</dt><dd>${Math.round(s.edge*100)}% of its length</dd><dt>Small areas touched</dt><dd>${s.hexes}</dd></dl>
      <p class="eyebrow">Share of the strip in each town</p>${bars(s.towns)}
      ${Object.keys(s.hoods).length?`<p class="eyebrow">Chicago community areas</p>${bars(s.hoods)}`:''}
      <p class="why">${esc(D.why[s.id.replace(/-\d+$/,'')]||'')}</p>`;
    return;
  }
  if (state.sel?.kind==='ring'){
    const r=D.rings.find(x=>x.id===state.sel.id), s=r.sat;
    const share=(k,lab)=>`<div class="bar"><div class="t"><i style="width:${Math.round(s[k]*100)}%;background:var(--ring)"></i><span>${lab}</span></div><b>${s[k].toFixed(2)}</b></div>`;
    panel.innerHTML=`<p class="eyebrow">${esc(r.size)} ring · practice data</p><h2>${esc(r.places.join(', '))}</h2>
      <dl><dt>Saturation</dt><dd><b>${s.saturation.toFixed(2)}</b> of 1, as of ${esc(r.as_of)}</dd><dt>Confidence</dt><dd>${s.confidence.toFixed(2)} (${s.weeks_observed} of 52 weeks, ${s.seasons_seen} seasons)</dd>
      <dt>Areas inside</dt><dd>${s.active} of ${s.hexagons} with traffic</dd></dl>
      <p class="eyebrow">The four shares it averages</p>
      <div class="bars">${share('coverage','Coverage: areas inside with traffic')}${share('steadiness','Steadiness: weeks with traffic')}${share('closure','Closure: scans that stay inside')}${share('reciprocity','Reciprocity: both ways evenly')}</div>
      <p class="eyebrow">Saturation as the weeks layer up</p>${chart(D.rings)}
      <p class="note">No threshold is set. Where a ring counts as saturated is found in practice, read against its own history and rings of the same size. Small = res 7 areas (about 5 km²), medium = res 6 (about 36 km²).</p>`;
    return;
  }
  if (state.sel?.kind==='node'){
    const n=D.nodes.find(x=>x.id===state.sel.id);
    const touching=D.segments.filter(s=>s.from===n.name||s.to===n.name);
    panel.innerHTML=`<p class="eyebrow">Node · ${esc(NODE_WORD[n.kind]||n.kind)}</p><h2>${esc(n.name)}</h2>
      <p class="eyebrow">Segments that meet here</p>
      <p>${touching.map(s=>`<button class="chip" data-seg="${esc(s.id)}">${esc(s.id)}</button>`).join(' ')||'None'}</p>`;
    for (const b of panel.querySelectorAll('[data-seg]')) b.onclick=()=>{ state.sel={kind:'seg',id:b.dataset.seg}; mark(); info(); };
    return;
  }
  const n=D.segments.length, st=D.segments.filter(s=>s.straddles).length;
  const km=D.segments.reduce((a,s)=>a+s.km,0), kmS=D.segments.filter(s=>s.straddles).reduce((a,s)=>a+s.km,0);
  panel.innerHTML=`<p class="eyebrow">${esc(D.name)}</p><h2>${st} of ${n} segments straddle a town line</h2>
    <p>That is ${kmS.toFixed(0)} of ${km.toFixed(0)} km of commercial strip. Corridors are cut where commerce clusters, never at a town line, so the gap between the two maps shows.</p>
    <div class="legend">
      <div><span class="sw" style="background:var(--one)"></span>Strip inside one town (darker = primary)</div>
      <div><span class="sw" style="background:var(--border)"></span>Strip across a town line (2+ towns hold 10%+)</div>
      <div><span class="sw" style="background:var(--border);border-radius:50%;width:10px"></span>Retail sited at a town line</div>
      <div><span class="sw" style="background:var(--transit);border-radius:50%;width:10px"></span>Station or transit hub</div>
      <div><span class="sw" style="background:var(--ring);border-radius:50%;width:10px"></span>Founding node or destination</div>
      <div><span class="sw" style="background:none;border:1.5px solid var(--hex6)"></span>Small, medium and large areas: where rings are read at three sizes</div>
      <div><span class="sw" style="background:var(--ring-fill);border:1.5px solid var(--ring)"></span>Ring (tap it for saturation): solid small, dashed medium</div>
    </div>
    <p class="note">Busy places and the ring are practice data from ourEventRings, made up to show how the layers stack. No real scans are drawn. Saturation has no fixed threshold: it is measured over time and calibrated in practice.</p>`;
}

for (const b of document.querySelectorAll('[data-place]')) b.onclick=()=>{
  state.place=b.dataset.place; for (const o of document.querySelectorAll('[data-place]')) o.setAttribute('aria-pressed', o===b); draw(); };
window.addEventListener('resize',()=>view());
steps(); chips(); draw(); requestAnimationFrame(()=>view());
if (window.ResizeObserver) new ResizeObserver(()=>view()).observe(svg);
</script>
